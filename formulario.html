<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão de Produto - Formulário de Avaliação</title>
    <meta name="description"
        content="Formulário de revisão e avaliação de produtos com classificação por estrelas, data de instalação e recursos úteis para feedback.">
    <meta name="author" content="Victor Carrera">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Roboto:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>

<body>
    <header>
        <h1>Revisão de Produto</h1>
    </header>
    <main>
        <form method="get" action="avaliacao.html">
            <label for="produto">Nome do Produto *</label>
            <select id="produto" name="produto" required>
                <option value="" disabled selected>Selecione um Produto...</option>
            </select>

            <fieldset>
                <legend>Classificação Geral *</legend>
                <label><input type="radio" id="estrela1" name="avaliacao" value="1" required> ☆ 1</label>
                <label><input type="radio" id="estrela2" name="avaliacao" value="2" required> ☆☆ 2</label>
                <label><input type="radio" id="estrela3" name="avaliacao" value="3" required> ☆☆☆ 3</label>
                <label><input type="radio" id="estrela4" name="avaliacao" value="4" required> ☆☆☆☆ 4</label>
                <label><input type="radio" id="estrela5" name="avaliacao" value="5" required> ☆☆☆☆☆ 5</label>
            </fieldset>

            <label for="dataInstalacao">Data de Instalação *</label>
            <input type="date" id="dataInstalacao" name="dataInstalacao" required>

            <fieldset>
                <legend>Recursos Úteis (marque todos que se aplicam)</legend>
                <label><input type="checkbox" id="recurso1" name="durabilidade" value="durabilidade">
                    Durabilidade</label>
                <label><input type="checkbox" id="recurso2" name="facilidade" value="facilidade"> Facilidade de
                    uso</label>
                <label><input type="checkbox" id="recurso3" name="desempenho" value="desempenho"> Desempenho</label>
                <label><input type="checkbox" id="recurso4" name="design" value="design"> Design</label>
            </fieldset>

            <label for="avaliacaoTexto">Avaliação Escrita</label>
            <textarea id="avaliacaoTexto" name="avaliacaoTexto" rows="4"></textarea>

            <label for="nomeUsuario">Nome de Usuário</label>
            <input type="text" id="nomeUsuario" name="nomeUsuario">

            <input type="submit" value="Enviar Avaliação">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Victor Carrera | WDD131</p>
    </footer>
</body>

</html>
