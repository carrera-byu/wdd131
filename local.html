<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>São Paulo - Brasil</title>
    <link rel="stylesheet" href="estilos/local.css">
    <script src="scripts/local.js" defer></script>
</head>

<body>

    <header>
        <h1>São Paulo</h1>
    </header>

    <main class="content">
        <div class="hero">
            <picture>
                <source srcset="imagens/hero-large.webp" media="(min-width: 900px)">
                <img src="imagens/hero-small.webp" alt="Mapa de Brasil destacando São Paulo" width="1500" height="1000">
            </picture>

            <section class="card card-dados">
                <h2>Dados</h2>
                <p><strong>País:</strong> Brasil</p>
                <p><strong>Estado:</strong> São Paulo</p>
                <p><strong>População:</strong> 11.904.961 (est. 2025)</p>
                <p><strong>Fundação:</strong> 1554</p>
                <p><strong>Idioma:</strong> Português</p>
                <p><strong>Moeda:</strong> Real (R$)</p>
            </section>
        </div>

        <section class="card card-clima">
            <h2>Clima ⛅</h2>
            <p><strong>Temperatura:</strong> <span id="temp">24</span>°C</p>
            <p><strong>Vento:</strong> <span id="wind">12</span> km/h</p>
            <p><strong>Condição:</strong> Parcialmente nublado</p>
            <p><strong>Sensação térmica:</strong> <span id="windchill">N/A</span></p>
        </section>
    </main>

    <footer>
        <p>© <span id="year"></span> 🌍 Victor Carrera 🌍 Brasil</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
