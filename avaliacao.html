<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Enviada</title>
    <link rel="stylesheet" href="estilos/formulario.css">
</head>

<body>
    <header>
        <h1>Revisão de Produto</h1>
    </header>
    <main>
        <h2>Obrigado pela sua avaliação!</h2>
        <p>Sua avaliação foi enviada com sucesso.</p>
        <p>Total de avaliações enviadas: <span id="contador"></span></p>
        <a href="formulario.html">Voltar ao formulário</a>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Victor Carrera</p>
    </footer>
    <script>
        let count = Number(localStorage.getItem("avaliacoes")) || 0;
        count++;
        localStorage.setItem("avaliacoes", count);
        document.getElementById("contador").textContent = count;
        document.getElementById("currentyear").textContent = new Date().getFullYear();
    </script>
</body>

</html>
